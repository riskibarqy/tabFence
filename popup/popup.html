<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabFence</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">NAVIGATION CONTROL</p>
      <h1>TabFence</h1>
      <p id="count" class="count">0 blocked here</p>
      <label class="row">
        <span>Protection</span>
        <input id="enabled" type="checkbox" checked>
      </label>
      <label class="row">
        <span id="site-label">Allow this site</span>
        <input id="site" type="checkbox">
      </label>
      <label class="row">
        <span>Show block notice</span>
        <input id="show-notice" type="checkbox" checked>
      </label>
      <p id="notice" class="notice" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
